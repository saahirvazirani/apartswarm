# 40 fixed one-line specs. Written by hand before task generation (Sat Nov 7 2026, ~7:00 PM EST).
# Each becomes tasks/<id>/ with spec.md, reference.py, wrong.py, test_hidden.py generated by glm-5.2 and validated.
- id: t001
  fn: slugify
  spec: "slugify(text: str) -> str: lowercase, replace every run of non-alphanumeric characters with a single hyphen, strip leading/trailing hyphens."
- id: t002
  fn: parse_duration
  spec: "parse_duration(s: str) -> int: parse strings like '1h30m15s', '45m', '2h' (any subset of h/m/s in that order) into total seconds; raise ValueError on anything else."
- id: t003
  fn: roman_to_int
  spec: "roman_to_int(s: str) -> int: convert a valid Roman numeral (I..MMMCMXCIX) to an integer, handling subtractive pairs IV, IX, XL, XC, CD, CM."
- id: t004
  fn: int_to_roman
  spec: "int_to_roman(n: int) -> str: convert an integer 1..3999 to a Roman numeral; raise ValueError outside that range."
- id: t005
  fn: run_length_encode
  spec: "run_length_encode(s: str) -> str: encode runs of repeated characters as char+count ('aaabcc' -> 'a3b1c2'); empty string -> ''."
- id: t006
  fn: run_length_decode
  spec: "run_length_decode(s: str) -> str: inverse of char+count encoding ('a3b1c12' -> 'aaabcccccccccccc'); counts may have several digits."
- id: t007
  fn: is_balanced
  spec: "is_balanced(s: str) -> bool: True iff all brackets (), [], {} in the string are correctly matched and nested; other characters are ignored."
- id: t008
  fn: top_k_words
  spec: "top_k_words(text: str, k: int) -> list[tuple[str, int]]: the k most frequent lowercase words (split on whitespace, strip surrounding punctuation), sorted by count descending then word ascending."
- id: t009
  fn: caesar_shift
  spec: "caesar_shift(text: str, k: int) -> str: shift ASCII letters by k positions (k may be negative or > 26) preserving case; leave other characters unchanged."
- id: t010
  fn: flatten
  spec: "flatten(items: list) -> list: recursively flatten arbitrarily nested lists into a single flat list, preserving order; non-list elements are leaves."
- id: t011
  fn: chunk
  spec: "chunk(items: list, n: int) -> list[list]: split a list into consecutive chunks of size n (last chunk may be shorter); raise ValueError if n < 1."
- id: t012
  fn: merge_intervals
  spec: "merge_intervals(intervals: list[tuple[int, int]]) -> list[tuple[int, int]]: merge overlapping or touching closed intervals and return them sorted by start."
- id: t013
  fn: two_sum_indices
  spec: "two_sum_indices(nums: list[int], target: int) -> tuple[int, int] | None: return the lexicographically smallest pair of indices (i, j) with i < j and nums[i] + nums[j] == target, or None."
- id: t014
  fn: transpose
  spec: "transpose(matrix: list[list]) -> list[list]: transpose a rectangular matrix given as a list of rows; an empty matrix returns []."
- id: t015
  fn: is_valid_ipv4
  spec: "is_valid_ipv4(s: str) -> bool: True iff s is four decimal octets 0-255 separated by dots, with no leading zeros (except '0' itself), no spaces, no extra characters."
- id: t016
  fn: parse_query_string
  spec: "parse_query_string(qs: str) -> dict[str, list[str]]: parse 'a=1&b=2&a=3' into {'a': ['1', '3'], 'b': ['2']}; a key without '=' maps to ['']; percent-decode %XX sequences and '+' as space; an optional leading '?' is ignored."
- id: t017
  fn: median
  spec: "median(nums: list[float]) -> float: the median of a non-empty list (mean of the two middle values for even length); raise ValueError on an empty list."
- id: t018
  fn: moving_average
  spec: "moving_average(nums: list[float], window: int) -> list[float]: averages of each consecutive window of the given size (len(nums) - window + 1 values); raise ValueError if window < 1 or window > len(nums)."
- id: t019
  fn: anagram_groups
  spec: "anagram_groups(words: list[str]) -> list[list[str]]: group words that are anagrams of each other (case-sensitive); each group sorted alphabetically, groups sorted by their first word."
- id: t020
  fn: longest_common_prefix
  spec: "longest_common_prefix(strs: list[str]) -> str: the longest prefix shared by all strings; '' for an empty list."
- id: t021
  fn: is_palindrome
  spec: "is_palindrome(s: str) -> bool: True iff the string reads the same forwards and backwards after removing non-alphanumeric characters and ignoring case."
- id: t022
  fn: fizzbuzz
  spec: "fizzbuzz(n: int) -> list[str]: for 1..n return 'Fizz' for multiples of 3, 'Buzz' for multiples of 5, 'FizzBuzz' for both, else the number as a string."
- id: t023
  fn: binary_search
  spec: "binary_search(sorted_nums: list[int], target: int) -> int: index of target in an ascending list (any index if duplicates) or -1 if absent; must be O(log n)."
- id: t024
  fn: lcm_list
  spec: "lcm_list(nums: list[int]) -> int: least common multiple of a non-empty list of positive integers; raise ValueError if empty or any value < 1."
- id: t025
  fn: to_snake_case
  spec: "to_snake_case(name: str) -> str: convert camelCase or PascalCase to snake_case, keeping acronyms together ('parseHTTPResponse' -> 'parse_http_response', 'userID' -> 'user_id')."
- id: t026
  fn: to_camel_case
  spec: "to_camel_case(name: str) -> str: convert snake_case to lowerCamelCase ('user_id' -> 'userId'); collapse repeated underscores and ignore leading/trailing ones."
- id: t027
  fn: letter_stats
  spec: "letter_stats(s: str) -> dict[str, int]: return {'vowels': n, 'consonants': n, 'digits': n, 'other': n} counting ASCII letters (y is a consonant), digits, and everything else except whitespace."
- id: t028
  fn: dedupe
  spec: "dedupe(items: list) -> list: remove duplicates while preserving first-occurrence order; items are hashable."
- id: t029
  fn: parse_csv_line
  spec: "parse_csv_line(line: str) -> list[str]: split one CSV line on commas, honoring double-quoted fields that may contain commas and doubled quotes ('\"a,b\",c,\"he said \"\"hi\"\"\"' -> ['a,b', 'c', 'he said \"hi\"'])."
- id: t030
  fn: format_bytes
  spec: "format_bytes(n: int) -> str: human-readable size using 1024 units with one decimal ('1536' -> '1.5 KB', '0' -> '0 B', bytes shown without decimals); units B, KB, MB, GB, TB."
- id: t031
  fn: levenshtein
  spec: "levenshtein(a: str, b: str) -> int: the edit distance (insertions, deletions, substitutions) between two strings."
- id: t032
  fn: prime_factors
  spec: "prime_factors(n: int) -> list[int]: the prime factorization of n >= 2 in non-decreasing order with multiplicity (12 -> [2, 2, 3]); raise ValueError for n < 2."
- id: t033
  fn: rotate_matrix
  spec: "rotate_matrix(matrix: list[list]) -> list[list]: rotate a square matrix 90 degrees clockwise and return the new matrix without modifying the input."
- id: t034
  fn: group_by
  spec: "group_by(records: list[dict], key: str) -> dict: group dicts by the value of records[key], preserving the order of first appearance in keys and within groups; records missing the key go under None."
- id: t035
  fn: normalize
  spec: "normalize(nums: list[float]) -> list[float]: min-max scale a list to [0, 1]; if all values are equal return a list of 0.0; an empty list returns []."
- id: t036
  fn: hex_to_rgb
  spec: "hex_to_rgb(s: str) -> tuple[int, int, int]: parse '#RRGGBB' or '#RGB' (case-insensitive, '#' optional) into an (r, g, b) tuple; raise ValueError on anything else."
- id: t037
  fn: rgb_to_hex
  spec: "rgb_to_hex(r: int, g: int, b: int) -> str: format three 0-255 ints as lowercase '#rrggbb'; raise ValueError if any component is out of range."
- id: t038
  fn: days_between
  spec: "days_between(a: str, b: str) -> int: number of days from ISO date a to ISO date b ('YYYY-MM-DD'), negative if b is earlier; raise ValueError on malformed input."
- id: t039
  fn: tokenize
  spec: "tokenize(expr: str) -> list[str]: split an arithmetic expression into tokens: integer or decimal numbers, operators + - * /, and parentheses; whitespace is skipped; raise ValueError on any other character."
- id: t040
  fn: eval_rpn
  spec: "eval_rpn(tokens: list[str]) -> float: evaluate a reverse-Polish expression with + - * / over numbers; raise ValueError on malformed input or division by zero."
